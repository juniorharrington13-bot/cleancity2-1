name: cleancity
description: "CLEANCITY Cameroon is a vibrant platform connecting waste generators, collectors, and processing centers to revolutionize urban waste management with real-time tracking, eco-points, and a mission to \"Collect • Recover • Preserve\" our beautiful country."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  latlong2: ^0.9.1
  flutter_map: ^8.0.0
  onesignal_flutter: ^5.0.0
  http: ^1.0.0
  geolocator: ^14.0.2
  mime: ^2.0.0
  image_picker: '>=1.1.2'
  supabase_flutter: '>=1.10.0'
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  provider: ^6.1.2
  go_router: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/cleancity.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/cleancity.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/cleancity.png"
    background_color: "#FFFFFF"
    theme_color: "#2E7D32"
