name: CleanCity CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # --no-fatal-infos: fail the build on real errors/warnings, not on
        # style-only info-level lints (unnecessary imports, missing curly
        # braces, deprecated members) that aren't worth blocking CI over.
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        if: hashFiles('test/**') != ''
        run: flutter test

  build:
    name: Build Android, iOS & Web
    needs: analyze_and_test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest # requis pour compiler la cible iOS
    permissions:
      contents: write # requis pour publier la GitHub Release des artefacts mobiles
    env:
      # Un seul fichier d'env généré à partir des secrets du repo, consommé par
      # tous les builds via --dart-define-from-file. Ajouter/mettre à jour les
      # secrets dans Settings > Secrets and variables > Actions.
      ENV_FILE: env/ci.json
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # requis pour les récentes versions de Gradle/Android
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Write build-time env file
        # Built with jq --arg (not a raw heredoc) so any stray whitespace,
        # newlines, or quotes accidentally pasted into a secret's value get
        # properly escaped instead of producing invalid JSON.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          OPEN_ROUTE_SERVICE_API_KEY: ${{ secrets.OPEN_ROUTE_SERVICE_API_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
        run: |
          jq -n \
            --arg supabase_url "$(printf '%s' "$SUPABASE_URL" | tr -d '\n\r')" \
            --arg supabase_anon_key "$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '\n\r')" \
            --arg mapbox_token "$(printf '%s' "$MAPBOX_ACCESS_TOKEN" | tr -d '\n\r')" \
            --arg openroute_key "$(printf '%s' "$OPEN_ROUTE_SERVICE_API_KEY" | tr -d '\n\r')" \
            --arg onesignal_id "$(printf '%s' "$ONESIGNAL_APP_ID" | tr -d '\n\r')" \
            '{
              "SUPABASE_URL": $supabase_url,
              "SUPABASE_ANON_KEY": $supabase_anon_key,
              "MAPBOX_ACCESS_TOKEN": $mapbox_token,
              "OPEN_ROUTE_SERVICE_API_KEY": $openroute_key,
              "ONESIGNAL_APP_ID": $onesignal_id
            }' > "$ENV_FILE"

      - name: Build Android APK
        run: flutter build apk --release --dart-define-from-file="$ENV_FILE"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: cleancity-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Build iOS App
        run: flutter build ios --release --no-codesign --dart-define-from-file="$ENV_FILE"

      - name: Package unsigned .ipa
        # Sideloading tools (Sideloadly, AltStore...) expect a real .ipa
        # (a zip with a Payload/ folder), not the raw .app bundle. This app
        # is still unsigned — the sideloading tool re-signs it with a free
        # Apple ID at install time.
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -qr ../CleanCity-unsigned.ipa Payload

      - name: Upload iOS .ipa
        uses: actions/upload-artifact@v4
        with:
          name: cleancity-ios-ipa
          path: build/ios/CleanCity-unsigned.ipa
          retention-days: 7

      - name: Build Web App
        # Served from the root of a pages.dev (sub)domain, unlike GitHub
        # Pages' /cleancity/ subpath, so base-href is just "/".
        run: flutter build web --release --base-href=/ --dart-define-from-file="$ENV_FILE"

      - name: Upload Web App
        uses: actions/upload-artifact@v4
        with:
          name: cleancity-web-app
          path: build/web
          retention-days: 7

      - name: Publish mobile builds to a GitHub Release
        # Cloudflare Pages rejects any deployed file over 25 MiB, and the
        # APK alone is ~60 MiB, so the binaries can't live inside the Pages
        # deploy (build/web). GitHub Releases has no such limit, so the APK/
        # IPA are published under a fixed "latest" tag instead, and
        # download.html links straight to those stable release URLs. Only
        # a small version.json goes into build/web, for the version label.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/web/downloads
          VERSION="$(grep '^version:' pubspec.yaml | cut -d' ' -f2)"
          jq -n --arg version "$VERSION" \
                --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{version: $version, builtAt: $builtAt}' \
                > build/web/downloads/version.json

          # `gh release create file#label` only sets the display label, not
          # the actual asset filename served at .../releases/download/<tag>/,
          # so the APK must be renamed on disk first to get a stable URL.
          # Renamed outside build/web so it never ends up in the Cloudflare
          # Pages deploy (which would hit the 25 MiB limit again).
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/CleanCity.apk"

          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            --title "CleanCity $VERSION (dernière build)" \
            --notes "Build automatique depuis main — APK Android et IPA iOS non signé pour installation directe." \
            "$RUNNER_TEMP/CleanCity.apk" \
            build/ios/CleanCity-unsigned.ipa

      - name: Ensure Cloudflare Pages project exists
        # `wrangler pages deploy` refuses to auto-create the project in
        # non-interactive CI (it can only prompt for confirmation in a real
        # terminal), so it must exist beforehand. This is idempotent — once
        # created, subsequent runs just get "already exists" and continue.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_TOKEN_API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT }}
        run: npx wrangler@3 pages project create cleancity --production-branch=main || true

      - name: Deploy web build to Cloudflare Pages
        # GitHub Pages (Fastly-backed) turned out to be unreachable from the
        # team's network/ISP; Cloudflare's edge has much stronger routing in
        # that region. Requires CLOUDFARE_TOKEN_API (Cloudflare Pages: Edit
        # permission) and CLOUDFARE_ACCOUNT secrets — see Settings >
        # Secrets and variables > Actions.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_TOKEN_API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT }}
        run: npx wrangler@3 pages deploy build/web --project-name=cleancity --commit-dirty=true
