<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CLEANCITY Cameroun connecte generateurs, collecteurs et centres de revalorisation pour une gestion des dechets plus propre.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CleanCity">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CleanCity</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Shown immediately (plain HTML/CSS, no JS/WASM download needed) so a
       slow connection sees visible progress instead of a blank page while
       the app bundle downloads. Flutter's canvas covers the full viewport
       once it attaches, so this is simply painted over — no cleanup needed. */
    #cc-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #F5F6F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1B5E20;
    }
    #cc-loader .cc-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #C8E6C9;
      border-top-color: #1B5E20;
      border-radius: 50%;
      animation: cc-spin 0.8s linear infinite;
    }
    @keyframes cc-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="cc-loader">
    <div class="cc-spinner"></div>
    <div>Chargement de CleanCity…</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
